; The POS's stereo step for FreePBX (docs/call-recordings.md, "Stereo"). Goes into
; /etc/asterisk/extensions_custom.conf on the PBX, as it is. It does nothing until a call is sent through it:
; a Custom Destination with the target  pos-stereo,s,1  and Return set to Yes, placed in the inbound route
; just before the Call Recording step.
;
; It records nothing itself. It tells FreePBX's own recording, for this one call, to also write each side of
; the call to a file of its own (r: what comes from the caller, t: what the caller hears), and to run
; /usr/local/sbin/pos-stereo when the recording ends, which puts the two sides into one stereo MP3 beside
; FreePBX's recording: 2026/11/26/pos-<the call's id>.mp3, the caller left, the restaurant right.
; FreePBX reads MONITOR_REC_OPTION and MIXMON_POST when it starts a recording; set on the call here, they
; stand in for the system-wide ones for this call only. A call that never comes through here records as
; before.
[pos-stereo]
exten => s,1,GotoIf($["${POS_LEGS}" != ""]?done)
 same => n,Set(__POS_LEGS=${STRFTIME(${EPOCH},,%Y/%m/%d)}/pos-${UNIQUEID})
 same => n,Set(__MONITOR_REC_OPTION=${MONITOR_REC_OPTION}r(${POS_LEGS}-in.wav)t(${POS_LEGS}-out.wav))
 same => n,Set(__MIXMON_POST=/usr/local/sbin/pos-stereo ${POS_LEGS})
 same => n(done),Return()
