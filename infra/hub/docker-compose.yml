# The POS services on a hub. Run through hubctl, or directly:
#   docker compose --project-directory /opt/pos -f /opt/pos/src/infra/hub/docker-compose.yml up -d
# /opt/pos/.env holds POSTGRES_PASSWORD and POS_NODE; bootstrap.sh writes it.
name: pos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /opt/pos/.env}
    volumes:
      - pos-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # this hub only; the standby hub gets its own rule in the failover spike
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: pos-backend:local # built by bootstrap.sh and hubctl update from backend/Dockerfile
    restart: unless-stopped
    environment:
      POS_NODE: ${POS_NODE:-hub}
      DATABASE_URL: postgresql://pos:${POSTGRES_PASSWORD}@db:5432/pos
      # Printers this hub drives, name=host[:port][/dialect], e.g. kitchen=172.19.1.162/escpos,bar=172.19.1.14/star
      POS_PRINTERS: ${POS_PRINTERS:-}
      POS_PRINT_DIRECT: "1"
      # Signs managers' menu-editor sessions; give both hubs and the cloud the same value so a session
      # survives a failover. Empty: each restart asks for the PIN again.
      POS_SECRET: ${POS_SECRET:-}
      # Named in the ready text ("order #12 is ready for pickup at ..."); texts only go to the log until a
      # messaging provider is wired in (POS_MESSAGING=log).
      POS_LOCATION: ${POS_LOCATION:-}
      POS_MESSAGING: ${POS_MESSAGING:-log}
      # The restaurant's time zone: menu hours, the day the order numbers count through and "today" when a
      # caller's order is looked up (POS_TIMEZONE); the times on tickets and in texts (TZ).
      POS_TIMEZONE: ${POS_TIMEZONE:-America/New_York}
      TZ: ${POS_TIMEZONE:-America/New_York}
      # The location's staff, `id:name:role:pin` for each person, comma-separated (docs/table-servers.md,
      # docs/delivery.md for a driver). It is the whole list: whoever is not in it cannot sign in, so name a
      # manager. Empty: the demo staff. `hubctl update` after changing it.
      POS_STAFF: ${POS_STAFF:-}
      # The PBX's manager interface, for desk phones linked to screens (docs/desk-phones.md): `pbx` is the
      # tunnel service below, which `hubctl pbx link` sets up. Empty: no PBX, the watcher stays off.
      POS_AMI_HOST: ${POS_AMI_HOST:-}
      POS_AMI_PORT: ${POS_AMI_PORT:-5038}
      POS_AMI_USER: ${POS_AMI_USER:-pos}
      POS_AMI_SECRET: ${POS_AMI_SECRET:-}
      POS_AMI_TLS: ${POS_AMI_TLS:-}
      # Apple's push key (docs/push-relay.md), for waking a locked iPhone or iPad: `hubctl push apple` puts the
      # key in /opt/pos/apns (mounted below) and writes these. Empty: no pushes go out.
      POS_APNS_KEY: ${POS_APNS_KEY:-}
      POS_APNS_KEY_ID: ${POS_APNS_KEY_ID:-}
      POS_APNS_TEAM_ID: ${POS_APNS_TEAM_ID:-}
      POS_APNS_BUNDLE_ID: ${POS_APNS_BUNDLE_ID:-org.chinasky.posApp}
      # The map service a delivery's distance is asked of (docs/delivery.md, "Looking the distance up"):
      # `hubctl maps key` writes the first two. Empty: nothing is looked up and the delivery fee is picked by
      # hand. POS_MAPS_DAILY is the most the hub asks in a day (500 unless set).
      POS_MAPS: ${POS_MAPS:-}
      POS_MAPS_KEY: ${POS_MAPS_KEY:-}
      POS_MAPS_DAILY: ${POS_MAPS_DAILY:-}
      # A second map service, asked when the first gives no distance ("A second map service" in the same
      # guide): `hubctl maps google` writes the key. Empty: there is no second. POS_MAPS_GOOGLE_DAILY is the
      # most Google is asked in a day (100 unless set).
      POS_MAPS_GOOGLE_KEY: ${POS_MAPS_GOOGLE_KEY:-}
      POS_MAPS_GOOGLE_DAILY: ${POS_MAPS_GOOGLE_DAILY:-}
      # Live traffic for a delivery's promised time ("Live traffic" in the same guide), turned on in the app.
      # POS_MAPS_TRAFFIC_DAILY is the most Google is asked about the roads in a day (150 unless set).
      POS_MAPS_TRAFFIC_DAILY: ${POS_MAPS_TRAFFIC_DAILY:-}
    volumes:
      - ./apns:/apns:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  pbx:
    # The hub's way to the PBX: an SSH tunnel to the PBX host that brings Asterisk's manager interface
    # (127.0.0.1:5038 there) to pbx:5038 on this network, and nothing else; no port on the hub itself. Runs
    # only with COMPOSE_PROFILES=pbx and POS_PBX_SSH (user@host) in /opt/pos/.env, both written by
    # `hubctl pbx link`, which also puts the hub's key (/opt/pos/pbx) on the PBX.
    image: pos-backend:local
    profiles: ["pbx"]
    restart: unless-stopped
    healthcheck:
      disable: true # the image's check asks the API, which this container does not run
    environment:
      POS_PBX_SSH: ${POS_PBX_SSH:-}
    volumes:
      - ./pbx:/pbx
    command:
      - sh
      - -c
      - |
        if [ -z "$$POS_PBX_SSH" ]; then echo "POS_PBX_SSH is not set: run hubctl pbx link user@host" >&2; sleep 60; exit 1; fi
        exec ssh -N -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
          -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/pbx/known_hosts -i /pbx/id_ed25519 \
          -L 0.0.0.0:5038:127.0.0.1:5038 "$$POS_PBX_SSH"

volumes:
  pos-db:
