name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install
        run: uv venv .venv && uv pip install -e '.[dev]'
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Test
        run: .venv/bin/pytest
      - name: Sync simulation (pulled cables)
        run: .venv/bin/python -m pos.sync.simulate --replicas 4 --rounds 400 --drop 0.4 --dup 0.2 --seed 7
