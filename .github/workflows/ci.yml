name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Actions, ci, Run workflow: builds the APK from any branch on demand

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pos -d pos" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POS_TEST_DATABASE_URL: postgresql://pos:pos@localhost:5432/pos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -q -e '.[dev]'
      - name: Chinese font for ticket rendering
        run: sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
      - name: What the PBX reads a call recording with (tests/phones/test_recordings.py runs the PBX's own programs)
        run: sudo apt-get install -y --no-install-recommends sox lame
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Test
        run: .venv/bin/pytest
      - name: Sync simulation (pulled cables)
        run: .venv/bin/python -m pos.sync.simulate --replicas 4 --rounds 400 --drop 0.4 --dup 0.2 --seed 7
      - name: Sync simulation (every backend dead mid-service, ADR 6)
        run: .venv/bin/python -m pos.sync.simulate --outage --replicas 4 --rounds 300 --drop 0.4 --dup 0.2 --seed 7

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint the hub scripts
        run: shellcheck infra/hub/bootstrap.sh infra/hub/hubctl infra/hub/pbx/pos-recordings infra/hub/pbx/pos-stereo
      - name: Validate the compose file
        run: POSTGRES_PASSWORD=x docker compose -f infra/hub/docker-compose.yml config -q
      - name: Build the backend image
        run: docker build -t pos-backend:ci backend
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 -v pos-keys-ci:/keys pos-backend:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
          # A new volume at /keys, as the hub's compose file mounts one: the API's own user must have been
          # able to make its sealing secret there (pos/keys.py), readable by nobody else.
          docker exec api sh -c 'test -s /keys/vault.key && test "$(stat -c %a /keys/vault.key)" = 600'
          # The face models baked into the image load on a thread after the start: the API must say they are ready.
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/faces/status | grep -q '"ready":true' && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/faces/status | tee /dev/stderr | grep -q '"ready":true'
          docker logs api
          docker rm -f api
      - name: The hub's services together, as a hub runs them
        run: |
          # The compose file itself, with the image just built: the database, the API, the push door and the
          # tunnel's keeper. A key for pushes in the hub's own file, as `hubctl online push key` writes one.
          docker tag pos-backend:ci pos-backend:local
          mkdir -p /tmp/hub/apns
          printf 'POSTGRES_PASSWORD=ci-only\nPOS_GLORIAFOOD_PUSH_KEY=ci-only-key-for-pushes-0123456789\n' > /tmp/hub/.env
          compose() { docker compose --project-directory /tmp/hub -f infra/hub/docker-compose.yml "$@"; }
          compose up -d
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
          # The staff from the hub's terminal, as `hubctl staff` runs it (pos/identity/staffctl.py). This hub's
          # file names nobody, so the demo staff sign in. A PIN set in the terminal is the manager's from then on
          # (looked at again at the end of this step: the API finds it within the minute, with no restart).
          signin() { curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "{\"device\": \"$2\", \"pin\": \"$1\"}" http://127.0.0.1:8000/signin; }
          compose exec -T api python -m pos.identity.staffctl list > staff.txt; cat staff.txt
          grep 'DEMO staff' staff.txt
          test "$(signin 9999 ci)" = 200
          printf '4827\n' | compose exec -T api python -m pos.identity.staffctl pin s3
          # The door runs beside the API and was told the key by it (pos/online/wayin.py), in a folder the door
          # may only read: it opens for that key and for nothing else, and an empty push puts nothing on the POS.
          push() { curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' "$@" --data '{"count": 0, "orders": []}' http://127.0.0.1:8090/online/push; }
          for i in $(seq 1 30); do [ "$(push -H 'Authorization: ci-only-key-for-pushes-0123456789')" = 200 ] && break; sleep 1; done
          test "$(push -H 'Authorization: ci-only-key-for-pushes-0123456789')" = 200
          test "$(push -H 'Authorization: somebody-else')" = 401
          test "$(push)" = 401
          compose exec -T door sh -c 'grep -q sha256 /door/key.json && ! grep -q ci-only /door/key.json'
          compose exec -T door sh -c '! touch /door/x 2> /dev/null'
          # The tunnel's keeper has Cloudflare's program, waits for a token, and says so where the API reads it.
          compose exec -T tunnel cloudflared --version
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/online/status | jq -e '.push.tunnel.there' > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/online/status | jq -e '.push.configured and .push.tunnel.there and .push.tunnel.state == "off"'
          # The PIN set in the terminal signs the manager in, and the one from the guide no more. Each try is from
          # another screen, since five misses lock one screen's pad for a minute.
          for i in $(seq 1 80); do [ "$(signin 4827 "ci-$i")" = 200 ] && break; sleep 1; done
          test "$(signin 4827 ci-new)" = 200
          test "$(signin 9999 ci-old)" = 401
          compose exec -T api python -m pos.identity.staffctl list > staff.txt; cat staff.txt
          grep 'kept in the app' staff.txt
          compose ps
          compose logs --tail 30 door tunnel
          compose down -v

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 3.50 deprecates package:flutter/material.dart, and Analyze fails on the notice in every file:
          # held at 3.47 until the app moves to package:material_ui (docs/developer-mac.md).
          flutter-version: 3.47.x
          cache: true
      - name: Packages
        run: flutter pub get
      - name: Format
        run: dart format -l 120 --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      # macOS and iOS builds need a Mac runner (10x minutes): see apple-build.yml, run weekly and on demand.
      # Android builds in the android job below.

  changes:
    # What a pull request touches, so the Android build below (the slow job: most of ten minutes cold) can be
    # skipped on a PR that cannot change it. The checkout of a PR is its merge with the base branch, so the diff
    # against the base branch's tip is the PR's own files.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@v5
      - name: Does it touch the Android build?
        id: diff
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          if git diff --name-only FETCH_HEAD HEAD | grep -Eq '^(apps/pos_app/(android/|pubspec\.(yaml|lock)$)|\.github/workflows/ci\.yml$)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    # Linux runners carry the Android SDK, so the Android build runs at Linux prices. Every push to main and every
    # run on demand build the APK and keep it; a pull request builds it only when it touches what the app job's
    # analysis and tests cannot cover: the Android project, the packages, or this workflow.
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.android == 'true') }}
    defaults:
      run:
        working-directory: apps/pos_app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle # Gradle itself, the Android plugin, Kotlin and the libraries: downloaded once, not every run
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 3.50 deprecates package:flutter/material.dart, and Analyze fails on the notice in every file:
          # held at 3.47 until the app moves to package:material_ui (docs/developer-mac.md).
          flutter-version: 3.47.x
          cache: true
      - run: flutter pub get
      - name: Build Android (debug-signed APK, 64-bit ARM)
        # Every Galaxy tablet and phone the restaurant would install it on is arm64; the 32-bit ARM and x86_64
        # builds of a fat APK would triple the native compile for nothing.
        run: flutter build apk --release --target-platform android-arm64
      # The APK stays with the run: Actions, the run, Artifacts, pos-app-apk. Install it on a tablet or phone from
      # there (apps/pos_app/README.md, "Android tablets and phones"). A week for main and a run on demand, a day
      # for a pull request: at 59 MB each, a month of them used up the account's artifact storage, and GitHub
      # then refuses every upload. The build above is the check, so a refused upload warns and does not fail.
      - name: Keep the APK
        id: keep
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pos-app-apk
          path: apps/pos_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}
          if-no-files-found: error
      - name: Say so when the APK could not be kept
        if: steps.keep.outcome == 'failure'
        run: >-
          echo "::warning title=APK built but not kept::GitHub refused the upload (see the Keep the APK step; the
          account's Actions artifact storage is most likely used up). Free storage or raise the Actions budget
          under the account's Billing settings, then run this workflow again on demand."
