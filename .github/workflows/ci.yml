name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Actions, ci, Run workflow: builds the APK from any branch on demand

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pos -d pos" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POS_TEST_DATABASE_URL: postgresql://pos:pos@localhost:5432/pos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -q -e '.[dev]'
      - name: Chinese font for ticket rendering
        run: sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Test
        run: .venv/bin/pytest
      - name: Sync simulation (pulled cables)
        run: .venv/bin/python -m pos.sync.simulate --replicas 4 --rounds 400 --drop 0.4 --dup 0.2 --seed 7
      - name: Sync simulation (every backend dead mid-service, ADR 6)
        run: .venv/bin/python -m pos.sync.simulate --outage --replicas 4 --rounds 300 --drop 0.4 --dup 0.2 --seed 7

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint the hub scripts
        run: shellcheck infra/hub/bootstrap.sh infra/hub/hubctl
      - name: Validate the compose file
        run: POSTGRES_PASSWORD=x docker compose -f infra/hub/docker-compose.yml config -q
      - name: Build the backend image
        run: docker build -t pos-backend:ci backend
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 pos-backend:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
          # The face models baked into the image load on a thread after the start: the API must say they are ready.
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/faces/status | grep -q '"ready":true' && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/faces/status | tee /dev/stderr | grep -q '"ready":true'
          docker logs api

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 3.50 deprecates package:flutter/material.dart, and Analyze fails on the notice in every file:
          # held at 3.47 until the app moves to package:material_ui (docs/developer-mac.md).
          flutter-version: 3.47.x
          cache: true
      - name: Packages
        run: flutter pub get
      - name: Format
        run: dart format -l 120 --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      # macOS and iOS builds need a Mac runner (10x minutes): see apple-build.yml, run weekly and on demand.
      # Android builds in the android job below.

  changes:
    # What a pull request touches, so the Android build below (the slow job: most of ten minutes cold) can be
    # skipped on a PR that cannot change it. The checkout of a PR is its merge with the base branch, so the diff
    # against the base branch's tip is the PR's own files.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@v5
      - name: Does it touch the Android build?
        id: diff
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          if git diff --name-only FETCH_HEAD HEAD | grep -Eq '^(apps/pos_app/(android/|pubspec\.(yaml|lock)$)|\.github/workflows/ci\.yml$)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    # Linux runners carry the Android SDK, so the Android build runs at Linux prices. Every push to main and every
    # run on demand build the APK and keep it; a pull request builds it only when it touches what the app job's
    # analysis and tests cannot cover: the Android project, the packages, or this workflow.
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.android == 'true') }}
    defaults:
      run:
        working-directory: apps/pos_app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle # Gradle itself, the Android plugin, Kotlin and the libraries: downloaded once, not every run
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 3.50 deprecates package:flutter/material.dart, and Analyze fails on the notice in every file:
          # held at 3.47 until the app moves to package:material_ui (docs/developer-mac.md).
          flutter-version: 3.47.x
          cache: true
      - run: flutter pub get
      - name: Build Android (debug-signed APK, 64-bit ARM)
        # Every Galaxy tablet and phone the restaurant would install it on is arm64; the 32-bit ARM and x86_64
        # builds of a fat APK would triple the native compile for nothing.
        run: flutter build apk --release --target-platform android-arm64
      # The APK stays with the run for 30 days: Actions, the run, Artifacts, pos-app-apk. Install it on a tablet or
      # phone from there (apps/pos_app/README.md, "Android tablets and phones").
      - name: Keep the APK
        uses: actions/upload-artifact@v7
        with:
          name: pos-app-apk
          path: apps/pos_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
