name: apple-build

# Builds the app for macOS and iOS on a Mac runner. Mac minutes cost ten times Linux minutes, so this runs
# weekly and on demand rather than on every push; ci.yml covers format, analysis and tests on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

jobs:
  apple:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/pos_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 3.50 deprecates package:flutter/material.dart, and Analyze fails on the notice in every file:
          # held at 3.47 until the app moves to package:material_ui (docs/developer-mac.md).
          flutter-version: 3.47.x
          cache: true
      - run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
